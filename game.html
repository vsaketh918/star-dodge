<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Star Dodge</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      color: #eef4ff;
      background: radial-gradient(ellipse at top, #17264a, #080b17 70%);
      font-family: system-ui, sans-serif;
    }

    .game {
      width: min(100%, 480px);
      text-align: center;
    }

    h1 {
      margin: 0 0 6px;
      letter-spacing: 0.12em;
    }

    .hint {
      margin: 0 0 14px;
      color: #aab8d5;
      font-size: 0.9rem;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 3 / 4;
      border: 2px solid #35456b;
      border-radius: 14px;
      background: #080d1b;
      box-shadow: 0 12px 50px #0008;
      touch-action: none;
    }

    button {
      margin-top: 14px;
      padding: 11px 26px;
      border: 0;
      border-radius: 999px;
      color: #08101f;
      background: #70e1fd;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }

    button:hover { background: #a1edff; }
    button:focus-visible { outline: 3px solid white; outline-offset: 3px; }
  </style>
</head>
<body>
  <main class="game">
    <h1>STAR DODGE</h1>
    <p class="hint">Dodge the meteors. How long can you last?</p>
    <canvas id="canvas" width="480" height="640" aria-label="Star Dodge game"></canvas>
    <button id="startButton">Start Game</button>
  </main>

  <script>
    const canvas = document.querySelector("#canvas");
    const ctx = canvas.getContext("2d");
    const startButton = document.querySelector("#startButton");

    const W = canvas.width;
    const H = canvas.height;
    const keys = new Set();

    let state = "ready";
    let player;
    let meteors = [];
    let stars = [];
    let score = 0;
    let best = Number(localStorage.getItem("starDodgeBest") || 0);
    let spawnTimer = 0;
    let lastTime = 0;
    let pointerDown = false;

    function resetGame() {
      player = { x: W / 2, y: H - 70, width: 34, height: 38, speed: 330 };
      meteors = [];
      score = 0;
      spawnTimer = 0;
      state = "playing";
      startButton.textContent = "Restart";
    }

    function makeStars() {
      stars = Array.from({ length: 75 }, () => ({
        x: Math.random() * W,
        y: Math.random() * H,
        size: Math.random() * 2 + 0.5,
        speed: Math.random() * 30 + 15
      }));
    }

    function spawnMeteor() {
      const size = Math.random() * 25 + 22;
      meteors.push({
        x: Math.random() * (W - size) + size / 2,
        y: -size,
        size,
        speed: 190 + Math.min(score * 3, 250) + Math.random() * 70
      });
    }

    function drawShip() {
      ctx.save();
      ctx.translate(player.x, player.y);
      ctx.fillStyle = "#70e1fd";
      ctx.beginPath();
      ctx.moveTo(0, -player.height / 2);
      ctx.lineTo(player.width / 2, player.height / 2);
      ctx.lineTo(0, player.height / 4);
      ctx.lineTo(-player.width / 2, player.height / 2);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = "#fff4a8";
      ctx.beginPath();
      ctx.moveTo(-6, player.height / 2 - 2);
      ctx.lineTo(0, player.height / 2 + 12 + Math.random() * 8);
      ctx.lineTo(6, player.height / 2 - 2);
      ctx.fill();
      ctx.restore();
    }

    function drawMeteor(meteor) {
      ctx.fillStyle = "#ff665f";
      ctx.beginPath();
      ctx.arc(meteor.x, meteor.y, meteor.size / 2, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#ffad69";
      ctx.beginPath();
      ctx.arc(
        meteor.x - meteor.size * 0.12,
        meteor.y - meteor.size * 0.12,
        meteor.size * 0.15,
        0,
        Math.PI * 2
      );
      ctx.fill();
    }

    function drawOverlay(title, subtitle) {
      ctx.fillStyle = "#050916bb";
      ctx.fillRect(0, 0, W, H);
      ctx.textAlign = "center";
      ctx.fillStyle = "#ffffff";
      ctx.font = "800 42px system-ui";
      ctx.fillText(title, W / 2, H / 2 - 15);
      ctx.fillStyle = "#c5d2ed";
      ctx.font = "18px system-ui";
      ctx.fillText(subtitle, W / 2, H / 2 + 25);
    }

    function update(dt) {
      for (const star of stars) {
        star.y += star.speed * dt;
        if (star.y > H) {
          star.y = 0;
          star.x = Math.random() * W;
        }
      }

      if (state !== "playing") return;

      score += dt * 10;

      if (keys.has("ArrowLeft") || keys.has("a")) player.x -= player.speed * dt;
      if (keys.has("ArrowRight") || keys.has("d")) player.x += player.speed * dt;
      player.x = Math.max(player.width / 2, Math.min(W - player.width / 2, player.x));

      spawnTimer += dt;
      const spawnRate = Math.max(0.28, 0.85 - score / 500);
      if (spawnTimer >= spawnRate) {
        spawnMeteor();
        spawnTimer = 0;
      }

      for (const meteor of meteors) {
        meteor.y += meteor.speed * dt;

        const dx = Math.abs(meteor.x - player.x);
        const dy = Math.abs(meteor.y - player.y);
        if (dx < meteor.size / 2 + player.width / 2 - 5 &&
            dy < meteor.size / 2 + player.height / 2 - 5) {
          state = "over";
          best = Math.max(best, Math.floor(score));
          localStorage.setItem("starDodgeBest", best);
          startButton.textContent = "Play Again";
        }
      }

      meteors = meteors.filter(m => m.y < H + m.size);
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);

      ctx.fillStyle = "#080d1b";
      ctx.fillRect(0, 0, W, H);

      for (const star of stars) {
        ctx.globalAlpha = 0.45 + star.size / 5;
        ctx.fillStyle = "#d9e7ff";
        ctx.fillRect(star.x, star.y, star.size, star.size);
      }
      ctx.globalAlpha = 1;

      for (const meteor of meteors) drawMeteor(meteor);
      if (player) drawShip();

      ctx.textAlign = "left";
      ctx.fillStyle = "#ffffff";
      ctx.font = "700 20px system-ui";
      ctx.fillText(`Score: ${Math.floor(score)}`, 18, 32);
      ctx.textAlign = "right";
      ctx.fillStyle = "#b8c8e8";
      ctx.fillText(`Best: ${best}`, W - 18, 32);

      if (state === "ready") {
        drawOverlay("READY?", "Press Start or use ← → to fly");
      } else if (state === "over") {
        drawOverlay("GAME OVER", `Score: ${Math.floor(score)}  •  Press Play Again`);
      }
    }

    function frame(time) {
      const dt = Math.min((time - lastTime) / 1000 || 0, 0.05);
      lastTime = time;
      update(dt);
      draw();
      requestAnimationFrame(frame);
    }

    function setPlayerFromPointer(event) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = W / rect.width;
      player.x = (event.clientX - rect.left) * scaleX;
      player.x = Math.max(player.width / 2, Math.min(W - player.width / 2, player.x));
    }

    startButton.addEventListener("click", resetGame);

    window.addEventListener("keydown", event => {
      const key = event.key.length === 1 ? event.key.toLowerCase() : event.key;
      if (["ArrowLeft", "ArrowRight", " "].includes(key)) event.preventDefault();
      keys.add(key);
      if (key === " " && state !== "playing") resetGame();
    });

    window.addEventListener("keyup", event => {
      const key = event.key.length === 1 ? event.key.toLowerCase() : event.key;
      keys.delete(key);
    });

    canvas.addEventListener("pointerdown", event => {
      if (state !== "playing") return;
      pointerDown = true;
      canvas.setPointerCapture(event.pointerId);
      setPlayerFromPointer(event);
    });

    canvas.addEventListener("pointermove", event => {
      if (pointerDown && state === "playing") setPlayerFromPointer(event);
    });

    canvas.addEventListener("pointerup", () => { pointerDown = false; });
    canvas.addEventListener("pointercancel", () => { pointerDown = false; });

    makeStars();
    player = { x: W / 2, y: H - 70, width: 34, height: 38, speed: 330 };
    requestAnimationFrame(frame);
  </script>
</body>
</html>
